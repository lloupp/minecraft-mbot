name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/laya-decision-server.py
      - run: python -m py_compile scripts/nanoandy-decision-server.py
      - run: python -m py_compile scripts/julia-decision-server.py
      - run: python -m unittest discover -s test -p 'test_laya_sidecar.py'
      - run: python -m unittest discover -s test -p 'test_nanoandy_sidecar.py'
      - run: python -m unittest discover -s test -p 'test_julia_sidecar.py'
      - run: npm test
      - run: npm run gauntlet:player-loop > /tmp/player-loop-v2.json

  natural-survival-e2e:
    name: Minecraft 1.20.1 natural survival 20m/arm (2 workers)
    # Run only on this opt-in experimental PR. Never runs on main.
    if: github.event_name == 'pull_request' && github.head_ref == 'test/natural-two-worker-soak-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Download official Minecraft 1.20.1 and verify pinned SHA-1
        run: python3 scripts/download-vanilla-server.py --version 1.20.1 --output .cache/vanilla-1.20.1.jar
      - name: Execute natural terrain with real 1.20.1 server and two bots
        env:
          MBOT_TEST_SERVER_JAR: .cache/vanilla-1.20.1.jar
          MBOT_TEST_EULA_ACCEPTED: '1'
          MBOT_SOAK_SECONDS: '1200'
          MBOT_SOAK_SEED: '42'
          MBOT_SOAK_NIGHT_MODE: natural
          MBOT_SOAK_AUTONOMOUS: '1'
          MBOT_SOAK_OUTPUT_DIR: e2e-evidence
        run: node scripts/tool-api-natural-soak.js
      - name: Preserve evidence (including failed runs; never upload world or server jar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-natural-e2e-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            e2e-evidence/report.json
            e2e-evidence/*-samples.jsonl
            e2e-evidence/*-app.log
            e2e-evidence/*-server.log
            e2e-evidence/*-observer.log
            e2e-evidence/*/checkpoints.json
            e2e-evidence/*/events.jsonl
