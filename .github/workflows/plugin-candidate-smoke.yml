name: Mineflayer candidate diagnostics (isolated)

on:
  pull_request:

permissions:
  contents: read

jobs:
  candidate:
    if: github.head_ref == 'test/mineflayer-plugin-isolation-20261028'
    name: Candidate / ${{ matrix.candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        candidate: [tps, death-event, bloodhound]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install candidate packages temporarily, without editing the lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts mineflayer-tps@1.0.1 mineflayer-death-event@2.0.0 mineflayer-bloodhound@0.0.2
      - name: Download and SHA-1 verify Minecraft 1.20.1 official server
        run: python3 scripts/download-vanilla-server.py --version 1.20.1 --output .cache/vanilla-1.20.1.jar
      - name: Probe a single candidate in its own throwaway world
        env:
          MBOT_TEST_SERVER_JAR: .cache/vanilla-1.20.1.jar
          MBOT_TEST_EULA_ACCEPTED: '1'
          MBOT_PLUGIN_EVIDENCE_DIR: candidate-evidence
        run: node scripts/plugin-candidate-smoke.js ${{ matrix.candidate }}
      - name: Upload evidence (no worlds, no jars)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.candidate }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            candidate-evidence/*.json
            candidate-evidence/*-server.log
